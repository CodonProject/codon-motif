[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codon-motif"
version = "0.1.1"
description = "MotifChord language model: gated delta-net and chord attention blocks with an intra-block attention residual."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "pyarrow>=15",
    "tensorboard>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/CodonProject/codon-motif"

[tool.setuptools.packages.find]
include = ["motif*"]

[tool.setuptools.package-data]
motif = ["tokenizer/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The cache provider is disabled: under the DSH file sandbox its failure cache
# cannot be created, and every run would print a PytestCacheWarning instead.
addopts = "-p no:cacheprovider"
